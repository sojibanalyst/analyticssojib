name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A new push cancels the previous run rather than queueing
# behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Repository *variables*, not secrets — these two are in the client
      # bundle by design, so hiding them would buy nothing.
      #
      # No fallback placeholder: since P2 the marketing pages read their
      # content from Supabase at build time, so a build without these produces
      # a site with no case studies rather than an error. Better for CI to
      # fail on a missing variable than to go green on an empty site.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Deliberately NOT provided. The secret-scan step must run against a build
      # that never had the service role key available, so a leak cannot be
      # explained away as "CI had it in the environment". The publishable key
      # above only ever sees rows the public can already read.

    steps:
      # v5, not v4: the v4 actions target Node 20, which GitHub deprecated on
      # its runners. v4 still runs today, forced onto Node 24, with a warning
      # on every job.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # node --test. No test framework is installed; Node ships one.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The one that matters. Fails if a server-only secret reached
      # .next/static — see scripts/check-no-secrets.mjs for what it looks for.
      - name: No secrets in the client bundle
        run: npm run check:secrets

      # Route parity: not one public URL may change, and /admin must not render
      # to a signed-out visitor. Runs against the production build, not dev.
      #
      # Signed out is the only state this can exercise, and it is the important
      # one: getUser() makes no network call without a session cookie, so the
      # placeholder Supabase URL above is enough.
      - name: Routes
        run: |
          npx next start --port 3000 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          npm run check:routes
